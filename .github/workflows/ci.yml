name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    name: Format, lint, tests with coverage, dependency audit, image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: make lint
      - run: make test
      - run: make audit
      - run: make docker-build
