<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="732" viewBox="0 0 1200 732" role="img" aria-labelledby="t d">
<title id="t">One price request, one sick provider</title>
<desc id="d">Seven numbered steps across five lanes. The load tool calls GET /price/sku, the controller validates the SKU and PriceService asks ProviderCall for a quote. The proxy first asks for a concurrency slot and rejects at once if all N are taken. The RestClient calls the fake provider with a 1 second connect and 2 second read timeout. Step 4 is amber: a 503 is retried at most twice after 100 milliseconds plus jitter and then 200 milliseconds. Step 5 is amber: a timeout is never retried. HttpQuoteSource names the failure, and PriceService falls back to the last good quote from the cache if it is younger than 60 seconds, answering 200 with stale true.</desc>
<style>
:root{--paper:#ffffff;--ink:#10243d;--mute:#52677f;--accent:#0a6aa8;--good:#19743f;--warn:#8a5a00}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="731" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="730" rx="16"/>
<text class="title" x="48" y="68">One price request, one sick provider</text>
<text class="caption" x="48" y="100">GET /price/sku with a sick provider. Amber: a 503 retried twice at most, a timeout never retried.</text>
<rect class="actor" x="420" y="128" width="100" height="48" rx="24"/>
<text class="lane" x="470" y="148" text-anchor="middle">Load</text>
<text class="lane" x="470" y="168" text-anchor="middle">tool</text>
<rect class="svc" x="565" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="620" y="148" text-anchor="middle">Price</text>
<text class="lane" x="620" y="168" text-anchor="middle">Service</text>
<rect class="svc" x="725" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="780" y="148" text-anchor="middle">Provider</text>
<text class="lane" x="780" y="168" text-anchor="middle">Call</text>
<rect class="svc" x="885" y="128" width="110" height="48" rx="10"/>
<text class="lane" x="940" y="158" text-anchor="middle">provider</text>
<rect class="svc" x="1040" y="128" width="100" height="48" rx="10"/>
<text class="lane" x="1090" y="148" text-anchor="middle">Quote</text>
<text class="lane" x="1090" y="168" text-anchor="middle">Cache</text>
<path class="hair" d="M470 176V232M620 176V616M780 176V568M940 176V496M1090 176V616"/>
<path class="hair" d="M66 216V600"/>

<circle class="dot" cx="66" cy="216" r="15"/><text class="num" x="66" y="221" text-anchor="middle">1</text>
<text class="label b t-ink" x="96" y="212">Controller validates the SKU</text>
<text class="sub" x="96" y="232">then PriceService.price</text>
<path class="sync" d="M470 216H620"/>
<text class="label t-accent" x="486" y="206">GET /price/sku</text>

<circle class="dot" cx="66" cy="280" r="15"/><text class="num" x="66" y="285" text-anchor="middle">2</text>
<text class="label b t-ink" x="96" y="276">Proxy asks for a slot</text>
<text class="sub" x="96" y="296">all N taken: rejected at once</text>
<path class="sync" d="M620 280H780"/>
<text class="label t-accent" x="636" y="270">fetch(sku)</text>

<circle class="dot" cx="66" cy="344" r="15"/><text class="num" x="66" y="349" text-anchor="middle">3</text>
<text class="label b t-ink" x="96" y="340">RestClient calls the provider</text>
<text class="sub" x="96" y="360">1 s connect, 2 s read</text>
<path class="sync" d="M780 344H940"/>
<text class="label t-accent" x="796" y="334">GET /quotes/sku</text>

<circle class="dot-w" cx="66" cy="408" r="15"/><text class="num" x="66" y="413" text-anchor="middle">4</text>
<text class="label b t-warn" x="96" y="404">503: retry, at most twice</text>
<text class="sub" x="96" y="424">100 ms + jitter, then 200 ms</text>
<path class="fail" d="M940 408H780"/>
<text class="label t-warn" x="796" y="398">503, retry</text>

<circle class="dot-w" cx="66" cy="472" r="15"/><text class="num" x="66" y="477" text-anchor="middle">5</text>
<text class="label b t-warn" x="96" y="468">Timeout: never retried</text>
<text class="sub" x="96" y="488">one call, 2 s already spent</text>
<rect class="slot" x="774" y="454" width="12" height="36" rx="4"/>
<text class="label t-warn" x="796" y="477">2 s timeout</text>

<circle class="dot" cx="66" cy="536" r="15"/><text class="num" x="66" y="541" text-anchor="middle">6</text>
<text class="label b t-ink" x="96" y="532">HttpQuoteSource names it</text>
<text class="sub" x="96" y="552">ProviderTimeout, Unavailable</text>
<path class="fail" d="M780 536H620"/>
<text class="label t-warn" x="636" y="526">failure</text>

<circle class="dot-g" cx="66" cy="600" r="15"/><text class="num" x="66" y="605" text-anchor="middle">7</text>
<text class="label b t-ink" x="96" y="596">Fallback: last good quote</text>
<text class="sub" x="96" y="616">younger than 60 s, else 504/503</text>
<path class="read" d="M1090 600H626"/>
<text class="label" x="946" y="590">last good</text>
<rect class="slot" x="614" y="582" width="12" height="36" rx="4"/>
<path class="ok" d="M614 600H586"/>
<rect class="win" x="410" y="580" width="176" height="40" rx="10"/>
<text class="label b t-good" x="426" y="605">200, stale: true</text>

<path class="sync" d="M48 688H112"/><text class="legend" x="124" y="693">sync call</text>
<path class="read" d="M520 688H584"/><text class="legend" x="596" y="693">read</text>
<path class="fail" d="M696 688H760"/><text class="legend" x="772" y="693">failure path</text>
<path class="ok" d="M928 688H992"/><text class="legend" x="1004" y="693">result</text>
</svg>
