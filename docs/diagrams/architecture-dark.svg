<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="788" viewBox="0 0 1200 788" role="img" aria-labelledby="t d">
<title id="t">A price service against a sick provider</title>
<desc id="d">A load tool calls GET /price/sku on the PriceController inside price-service, which returns 200 fresh, 200 stale, 503 or 504. PriceService asks HttpQuoteSource, which calls ProviderCall, a separate bean with a retry on 503 only, two retries, jittered, and a concurrency limit that rejects beyond N calls in flight. The RestClient uses a 1 second connect and 2 second read timeout to call the fake provider, which can be normal, slow, 503 or hang. PriceService remembers fresh quotes in InMemoryQuoteCache for 60 seconds and falls back to the last good one labeled stale. Metrics and traces go to the Grafana dashboard. Two amber notes name the provider failures: 503 gets at most three calls, and a hang gets one call and a 2 second timeout, never a retry.</desc>
<style>
:root{--paper:#0d1117;--ink:#f5f4f8;--mute:#9a96ab;--accent:#6ec8ff;--good:#7ce0a1;--warn:#ffd166}
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;fill:var(--ink)}
.title{font-family:Georgia,'Iowan Old Style','Times New Roman',serif;font-size:36px}
.caption{font-size:16px;fill:var(--mute)}
.name{font-size:20px;font-weight:600}
.lane{font-size:17px;font-weight:600}
.sub{font-size:15px;fill:var(--mute)}
.label{font-size:15px}
.tag{font-size:15px;fill:var(--mute)}
.num{font-size:15px;font-weight:700;fill:var(--paper)}
.legend{font-size:14px;fill:var(--mute)}
.t-accent{fill:var(--accent)}
.t-good{fill:var(--good)}
.t-warn{fill:var(--warn)}
.t-ink{fill:var(--ink)}
.b{font-weight:600}
.paper{fill:var(--paper);stroke:var(--mute);stroke-opacity:.3}
.grid{fill:url(#grid)}
.boundary{fill:var(--mute);fill-opacity:.035;stroke:var(--mute);stroke-opacity:.7;stroke-dasharray:6 5}
.svc{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1.25}
.store{fill:var(--mute);fill-opacity:.1;stroke:var(--mute);stroke-width:1.25}
.rim{fill:none;stroke:var(--mute);stroke-width:1.25}
.actor{fill:none;stroke:var(--mute);stroke-width:1.25}
.slot{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1}
.note{fill:var(--warn);fill-opacity:.09;stroke:var(--warn);stroke-width:1}
.win{fill:var(--good);fill-opacity:.09;stroke:var(--good);stroke-width:1}
.hair{fill:none;stroke:var(--mute);stroke-opacity:.4;stroke-width:1}
.zone{fill:var(--accent);fill-opacity:.045;stroke:var(--accent);stroke-width:1.25;stroke-dasharray:6 5}
.stop{fill:none;stroke:var(--warn);stroke-width:4;stroke-linecap:round}
.mask{fill:var(--paper)}
.sync,.async,.read,.fail,.ok{fill:none}
.sync{stroke:var(--accent);stroke-width:1.75;marker-end:url(#a-sync)}
.async{stroke:var(--accent);stroke-width:1.75;stroke-dasharray:8 6;marker-end:url(#a-async)}
.read{stroke:var(--mute);stroke-width:1.75;stroke-linecap:round;stroke-dasharray:1 6;marker-end:url(#a-read)}
.fail{stroke:var(--warn);stroke-width:2;marker-end:url(#a-fail)}
.ok{stroke:var(--good);stroke-width:1.75;marker-end:url(#a-ok)}
.dot{fill:var(--accent)}
.dot-w{fill:var(--warn)}
.dot-g{fill:var(--good)}
.head-sync,.head-async{stroke:var(--accent)}
.head-sync{fill:var(--accent)}
.head-async,.head-read{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.head-read{stroke:var(--mute)}
.head-fail{fill:var(--warn)}
.head-ok{fill:var(--good)}
.gridline{fill:none;stroke:var(--mute);stroke-opacity:.09}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path class="gridline" d="M40 0H0V40"/></pattern>
<marker id="a-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-sync" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-async" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-async" d="M1 1L9 5L1 9"/></marker>
<marker id="a-read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-read" d="M1 1L9 5L1 9"/></marker>
<marker id="a-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-fail" d="M0 0L10 5L0 10z"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-ok" d="M0 0L10 5L0 10z"/></marker>
</defs>
<rect class="paper" x="0.5" y="0.5" width="1199" height="787" rx="16"/>
<rect class="grid" x="1" y="1" width="1198" height="786" rx="16"/>
<text class="title" x="48" y="68">A price service against a sick provider</text>
<text class="caption" x="48" y="100">Timeouts, bounded retries, a cap on calls in flight, a stale fallback. Amber: how a sick provider is handled.</text>

<rect class="actor" x="48" y="198" width="152" height="84" rx="42"/>
<text class="name" x="124" y="232" text-anchor="middle">Load tool</text>
<text class="sub" x="124" y="256" text-anchor="middle">GET /price/sku</text>

<rect class="boundary" x="264" y="132" width="888" height="408" rx="14"/>
<text class="tag" x="280" y="160">price-service</text>
<rect class="svc" x="280" y="176" width="200" height="140" rx="12"/>
<text class="name" x="296" y="208">PriceController</text>
<text class="sub" x="296" y="232">validates the SKU</text>
<text class="sub" x="296" y="254">200 fresh or stale,</text>
<text class="sub" x="296" y="276">503, 504</text>
<rect class="svc" x="504" y="176" width="176" height="140" rx="12"/>
<text class="name" x="520" y="208">PriceService</text>
<text class="sub" x="520" y="232">use case:</text>
<text class="sub" x="520" y="254">fresh, else stale</text>
<rect class="svc" x="704" y="176" width="200" height="140" rx="12"/>
<text class="name" x="720" y="208">HttpQuoteSource</text>
<text class="sub" x="720" y="232">names the outcome:</text>
<text class="sub" x="720" y="254">ProviderTimeout,</text>
<text class="sub" x="720" y="276">ProviderUnavailable</text>
<text class="sub" x="720" y="298">ProviderBusy</text>
<rect class="svc" x="928" y="176" width="208" height="140" rx="12"/>
<text class="name" x="944" y="208">ProviderCall</text>
<text class="sub" x="944" y="232">@Retryable, 503 only</text>
<text class="sub" x="944" y="254">2 retries, jittered</text>
<text class="sub" x="944" y="276">@ConcurrencyLimit</text>
<text class="sub" x="944" y="298">REJECT, N in flight</text>

<rect class="note" x="288" y="388" width="176" height="108" rx="10"/>
<text class="label b t-warn" x="304" y="416">Provider 503</text>
<text class="sub" x="304" y="440">1 + 2 retries,</text>
<text class="sub" x="304" y="462">then stale or 503</text>
<path class="store" d="M488 412a124 12 0 0 1 248 0v98a124 12 0 0 1 -248 0z"/>
<path class="rim" d="M488 412a124 12 0 0 0 248 0"/>
<text class="name" x="612" y="444" text-anchor="middle">InMemoryQuoteCache</text>
<text class="sub" x="612" y="466" text-anchor="middle">60 s from the write</text>
<text class="sub" x="612" y="488" text-anchor="middle">last good quote per SKU</text>
<rect class="svc" x="928" y="388" width="208" height="84" rx="12"/>
<text class="name" x="944" y="420">RestClient</text>
<text class="sub" x="944" y="444">1 s connect, 2 s read</text>
<text class="sub" x="944" y="466">Boot's builder</text>

<rect class="svc" x="928" y="600" width="208" height="96" rx="12"/>
<text class="name" x="944" y="632">Fake provider</text>
<text class="sub" x="944" y="656">normal/slow/503/hang</text>
<text class="sub" x="944" y="678">/admin/*, /metrics</text>
<rect class="note" x="568" y="588" width="320" height="108" rx="10"/>
<text class="label b t-warn" x="584" y="616">Provider hangs</text>
<text class="sub" x="584" y="640">2 s read timeout, one call,</text>
<text class="sub" x="584" y="662">stale or 504, never a retry</text>
<path class="store" d="M272 612a136 12 0 0 1 272 0v76a136 12 0 0 1 -272 0z"/>
<path class="rim" d="M272 612a136 12 0 0 0 272 0"/>
<text class="name" x="408" y="652" text-anchor="middle">Dashboard</text>
<text class="sub" x="408" y="674" text-anchor="middle">Grafana, Tempo, Prometheus</text>

<path class="sync" d="M200 232H280"/>
<path class="ok" d="M280 262H200"/>
<path class="sync" d="M480 246H504"/>
<path class="sync" d="M680 246H704"/>
<path class="sync" d="M904 246H928"/>
<path class="sync" d="M540 316V400"/>
<text class="label t-accent" x="528" y="360" text-anchor="end">remember</text>
<path class="read" d="M640 400V316"/>
<text class="label" x="652" y="360">last good, stale</text>
<path class="sync" d="M1032 316V388"/>
<path class="sync" d="M1032 472V600"/>
<text class="label t-accent" x="1020" y="572" text-anchor="end">GET /quotes/sku</text>
<path class="async" d="M400 540V600"/>
<text class="label t-accent" x="412" y="574">metrics, traces</text>

<path class="sync" d="M48 744H112"/><text class="legend" x="124" y="749">sync call</text>
<path class="async" d="M264 744H328"/><text class="legend" x="340" y="749">async message</text>
<path class="read" d="M520 744H584"/><text class="legend" x="596" y="749">read</text>
<path class="ok" d="M928 744H992"/><text class="legend" x="1004" y="749">result</text>
</svg>
